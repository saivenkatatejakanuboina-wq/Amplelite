<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none" role="img" aria-labelledby="dmsHubTitle">
  <title id="dmsHubTitle">Document Management hub</title>
  <defs>
    <linearGradient id="dmsBg" x1="80" y1="40" x2="740" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071A33"/>
      <stop offset="1" stop-color="#0B3A66"/>
    </linearGradient>
    <radialGradient id="dmsGlow" cx="400" cy="280" r="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35BFE3" stop-opacity=".28"/>
      <stop offset="1" stop-color="#35BFE3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dmsRing" x1="292" y1="172" x2="508" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#1677A8"/>
    </linearGradient>
    <filter id="dmsSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="560" rx="28" fill="url(#dmsBg)"/>
  <circle cx="400" cy="280" r="220" fill="url(#dmsGlow)"/>
  <g stroke="#35BFE3" stroke-opacity=".12" fill="none">
    <circle cx="160" cy="120" r="46"/>
    <circle cx="680" cy="150" r="34"/>
    <circle cx="140" cy="430" r="28"/>
    <circle cx="660" cy="430" r="40"/>
  </g>
  <g fill="#7DD3FC" fill-opacity=".35">
    <circle cx="210" cy="90" r="2.5"/>
    <circle cx="620" cy="80" r="2"/>
    <circle cx="730" cy="300" r="2.5"/>
    <circle cx="90" cy="250" r="2"/>
    <circle cx="520" cy="500" r="2"/>
    <circle cx="280" cy="500" r="1.8"/>
  </g>

  <g stroke="#7DD3FC" stroke-width="1.6" stroke-opacity=".55">
    <line x1="400" y1="280" x2="248" y2="132"/>
    <line x1="400" y1="280" x2="552" y2="132"/>
    <line x1="400" y1="280" x2="612" y2="280"/>
    <line x1="400" y1="280" x2="552" y2="428"/>
    <line x1="400" y1="280" x2="248" y2="428"/>
    <line x1="400" y1="280" x2="188" y2="280"/>
  </g>

  <g transform="translate(400 280)">
    <circle r="78" fill="#08233F" stroke="url(#dmsRing)" stroke-width="3"/>
    <circle r="68" fill="none" stroke="#35BFE3" stroke-opacity=".25" stroke-width="1"/>
    <text y="10" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="1.4">DMS</text>
  </g>

  <!-- gears -->
  <g transform="translate(248 132)">
    <circle r="36" fill="#08233F" stroke="#7DD3FC" stroke-width="2"/>
    <path fill="#E8F7FC" d="M-2-16h4l1.4 4.6 4.4-1.6 2 3.4-3.6 3.1 3.6 3.1-2 3.4-4.4-1.6L2 16h-4l-1.4-4.6-4.4 1.6-2-3.4 3.6-3.1-3.6-3.1 2-3.4 4.4 1.6L-2-16zm2 10a6 6 0 100 12 6 6 0 000-12z"/>
  </g>
  <!-- user -->
  <g transform="translate(552 132)">
    <circle r="36" fill="#08233F" stroke="#7DD3FC" stroke-width="2"/>
    <path fill="#E8F7FC" d="M0-10a7 7 0 110 14 7 7 0 010-14zm0 16c-8 0-14 4.4-14 10v2h28v-2c0-5.6-6-10-14-10z"/>
  </g>
  <!-- document -->
  <g transform="translate(612 280)">
    <circle r="36" fill="#08233F" stroke="#7DD3FC" stroke-width="2"/>
    <path fill="#E8F7FC" d="M-8-14h10l8 8v20H-8V-14zm10 1.6V-4h6.2L2-12.4zM-4-4h8v2h-8v-2zm0 5h12v2H-4V1zm0 5h12v2H-4V6z"/>
  </g>
  <!-- lock -->
  <g transform="translate(552 428)">
    <circle r="36" fill="#08233F" stroke="#7DD3FC" stroke-width="2"/>
    <path fill="#E8F7FC" d="M-7 2h14v12H-7V2zm2 0V-2a5 5 0 1110 0v4h-2V-2a3 3 0 10-6 0v4H-5z"/>
  </g>
  <!-- shield -->
  <g transform="translate(248 428)">
    <circle r="36" fill="#08233F" stroke="#7DD3FC" stroke-width="2"/>
    <path fill="#E8F7FC" d="M0-14l12 5v8c0 7.4-4.8 12.4-12 15-7.2-2.6-12-7.6-12-15v-8l12-5zm-1 8v8.5l6-4.2-1.2-1.6-4.2 3-2.2-2.2-1.4 1.4 3.6 3.6z"/>
  </g>
  <!-- megaphone -->
  <g transform="translate(188 280)">
    <circle r="36" fill="#08233F" stroke="#7DD3FC" stroke-width="2"/>
    <path fill="#E8F7FC" d="M10-8v16L-4 4v-8l14-4zM-8 0h3v8H-9.5A3.5 3.5 0 01-13 4.5 3.5 3.5 0 01-8 0z"/>
  </g>
</svg>
